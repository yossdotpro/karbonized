name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - master

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # yarn.lock is not committed, so the install has to be allowed to create it
      # (Yarn 4 enables immutable installs by default on CI).
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - name: Build
        run: yarn build
