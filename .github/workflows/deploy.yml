name: Deploy

# GitHub Pages deploy. The app is deployed to production through Vercel; this
# workflow only runs on demand until it is decided whether Pages is still needed.
# Note: the app is built for the site root (Vite `base` and BrowserRouter have
# no base path), so it does not work as-is under /karbonized/ on GitHub Pages.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Enable Corepack
        run: corepack enable

      # yarn.lock is not committed, so the install has to be allowed to create it
      # (Yarn 4 enables immutable installs by default on CI).
      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Build project
        run: yarn build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    name: Deploy
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
